<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} — {{ brand.nome_empresa }}</title>
<style>
  body { margin: 0; background: #f5f6f9; color: #16181d; font: 16px/1.7 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  article { background: #fff; border-radius: 16px; padding: 28px 22px; }
  @media (min-width: 720px) { article { padding: 40px; } }
  h1 { font-size: 1.8rem; line-height: 1.2; margin: 0 0 .4em; }
  h2 { font-size: 1.15rem; margin: 1.8em 0 .4em; }
  a { color: {{ brand.cor_primaria|default:"#1d4ed8" }}; }
  .muted { color: #4a5160; font-size: .9rem; }
</style>
</head>
<body>
<main><article>{% block content %}{% endblock %}</article></main>
</body>
</html>
